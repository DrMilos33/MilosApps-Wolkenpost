<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#dff5ee" />
    <meta
      name="description"
      content="Zeichne ein Flugobjekt und schicke es mit echten Winddaten auf eine stilisierte Weltreise."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link vite-ignore rel="stylesheet" href="./vendor/milosapps-essentials/v1/milos-app-essentials.css" />
    <link vite-ignore rel="stylesheet" href="./vendor/milosapps-essentials/v1/milos-app-essentials-theme.css" />
    <link vite-ignore rel="stylesheet" href="./vendor/milosapps-layout/v1/milos-app-layout.css" />
    <link vite-ignore rel="stylesheet" href="./vendor/milosapps-layout/v1/milos-app-layout-theme.css" />
    <title>Wolkenpost – Deine Zeichnung reist mit dem Wind</title>
  </head>
  <body data-milos-essentials-loading>
    <section data-milos-app-loading role="status" aria-live="polite">
      <div data-milos-loading-card>
        <img data-milos-loading-icon src="icon.svg" width="52" height="52" alt="" />
        <span data-milos-loading-brand>MilosApps</span>
        <p data-milos-loading-title>Wolkenpost</p>
        <p data-milos-loading-message>Wolkenpost wird geöffnet …</p>
        <span data-milos-loading-progress aria-hidden="true"></span>
      </div>
    </section>
    <milos-app-shell>
      <svg slot="app-icon" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
        <rect width="40" height="40" rx="10" fill="currentColor" />
        <path
          d="M10.8 25.4c-3.7 0-6.4-2.6-6.4-6 0-3 2.3-5.5 5.3-5.9C11 9 15 6 19.7 6c5.4 0 9.8 4 10.4 9.2 3.3.5 5.5 2.9 5.5 6 0 3.5-2.8 6.2-6.5 6.2H10.8Z"
          fill="var(--bg, #fffdf8)"
        />
        <path
          d="M11.3 30.1c5.5 1.7 11.2 1.8 17.4.1"
          fill="none"
          stroke="var(--accent, #b34834)"
          stroke-linecap="round"
          stroke-width="2.4"
        />
      </svg>
      <main id="main" slot="main">
        <div id="root"><h1>Zeichne. Lass es fliegen.</h1></div>
        <noscript>Wolkenpost benötigt JavaScript für die Zeichenfläche und die Windroute.</noscript>
      </main>
    </milos-app-shell>
    <script type="module" vite-ignore src="./vendor/milosapps-essentials/v1/bootstrap.js"></script>
    <script type="module" vite-ignore src="./vendor/milosapps-shell/v2/bootstrap.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
